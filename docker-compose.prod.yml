# Production stack — usage:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d --remove-orphans
#
# Required env (in .env on the VPS):
#   IMAGE_TAG                  (e.g. prod-v1.0.5 — supplied by CI)
#   DOCKERHUB_NAMESPACE        (e.g. zstin4)
#   API_DOMAIN                 (e.g. api.kevinefray.dev)
#   ADMIN_DOMAIN               (e.g. admin.kevinefray.dev)
#   PORTFOLIO_DOMAIN           (e.g. kevinefray.dev — for CORS only)
#   CERT_RESOLVER              (Traefik certresolver name, e.g. letsencrypt)
#   JWT_SECRET
#   ADMIN_BOOTSTRAP_EMAIL
#   ADMIN_BOOTSTRAP_PASSWORD
#   GITHUB_USERNAME            (optionnel — compte GitHub synchronise)
#   GITHUB_TOKEN               (optionnel — jeton GitHub en lecture seule)
#
# Resource caps (shared VPS, 8 vCPU / 24 GB) — see CAPACITY.md in the
# Infrastructure repo. mem_limit is a safety ceiling, not a reservation;
# cpu_shares only matters under contention (1024 = production traffic).

x-logging: &logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ─── MongoDB (internal only) ────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: portfolio-mongo
    restart: always
    command: ["--bind_ip", "0.0.0.0", "--quiet"]
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    # WiredTiger sizes its cache from the cgroup limit: without a limit it
    # would claim ~11 GB (half of the host's RAM) on this shared VPS.
    mem_limit: 1g
    cpus: 1.5
    cpu_shares: 1024
    logging: *logging
    networks:
      - portfolio_net

  # ─── Prometheus exporter for MongoDB ────────────────────────────────────
  # Lives here rather than in the Infrastructure stack so that portfolio-mongo
  # can stay on its private network (it has no auth): only the exporter is
  # exposed on the shared "web" network, and it only serves metrics.
  # The container name is the one prometheus.yml scrapes (job "mongodb").
  mongodb-exporter:
    image: percona/mongodb_exporter:0.40
    container_name: mongodb-exporter-portfolio
    restart: always
    command:
      - '--mongodb.uri=mongodb://mongo:27017'
      - '--collect-all'
      # Noms de metriques lisibles (mongodb_connections, mongodb_opcounters_total…)
      - '--compatible-mode'
    expose:
      - "9216"
    depends_on:
      mongo:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.2
    cpu_shares: 256
    logging: *logging
    networks:
      - portfolio_net
      - web

  # ─── NestJS API ─────────────────────────────────────────────────────────
  backend:
    image: ${DOCKERHUB_NAMESPACE}/portfolio-api:${IMAGE_TAG}
    container_name: portfolio-api
    restart: always
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      MONGO_URI: mongodb://mongo:27017/portfolio
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: https://${ADMIN_DOMAIN},https://${PORTFOLIO_DOMAIN}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD}
      UPLOAD_DIR: /app/uploads
      # SMTP (notifications email a la reception d'un message de contact)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      CONTACT_NOTIFY_TO: ${CONTACT_NOTIFY_TO:-}
      # Reutilise pour generer le lien "Ouvrir l'admin" dans les emails
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      # Synchronisation GitHub : compte par defaut + jeton (lecture seule) pour 5000 req/h
      GITHUB_USERNAME: ${GITHUB_USERNAME:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - backend_uploads:/app/uploads
    expose:
      - "3001"
    mem_limit: 640m
    cpus: 1.5
    cpu_shares: 1024
    logging: *logging
    networks:
      - portfolio_net
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      # HTTPS router
      - "traefik.http.routers.portfolio-backend.rule=Host(`${API_DOMAIN}`)"
      - "traefik.http.routers.portfolio-backend.entrypoints=websecure"
      - "traefik.http.routers.portfolio-backend.tls=true"
      - "traefik.http.routers.portfolio-backend.tls.certresolver=${CERT_RESOLVER}"
      - "traefik.http.services.portfolio-backend.loadbalancer.server.port=3001"
      # Body size limit for uploads (100 MB videos)
      - "traefik.http.middlewares.portfolio-backend-bodylimit.buffering.maxRequestBodyBytes=104857600"
      - "traefik.http.routers.portfolio-backend.middlewares=portfolio-backend-bodylimit"

  # ─── Next.js admin ──────────────────────────────────────────────────────
  admin:
    image: ${DOCKERHUB_NAMESPACE}/portfolio-admin:${IMAGE_TAG}
    container_name: portfolio-admin
    restart: always
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
    expose:
      - "3000"
    mem_limit: 640m
    cpus: 1
    cpu_shares: 1024
    logging: *logging
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.portfolio-admin.rule=Host(`${ADMIN_DOMAIN}`)"
      - "traefik.http.routers.portfolio-admin.entrypoints=websecure"
      - "traefik.http.routers.portfolio-admin.tls=true"
      - "traefik.http.routers.portfolio-admin.tls.certresolver=${CERT_RESOLVER}"
      - "traefik.http.services.portfolio-admin.loadbalancer.server.port=3000"

volumes:
  mongo_data:
  mongo_config:
  backend_uploads:

networks:
  portfolio_net:
    driver: bridge
  web:
    external: true
    name: web
