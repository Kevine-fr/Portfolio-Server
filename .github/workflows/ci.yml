name: CI

on:
  pull_request:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── NestJS API: typecheck, unit + e2e tests, integration on a real MongoDB ──
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MONGO_URI_TEST: mongodb://localhost:27017/portfolio_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - name: Tests (unit + e2e + MongoDB integration)
        run: npx jest --ci --coverage
      - run: npm run build

  # ─── Next.js admin: typecheck, component tests, production build ────────
  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Rendu réel dans Chromium sur le build : aucune page ne doit défiler
      # horizontalement de 320 à 1440 px (débordements corrigés sur mobile).
      - run: npx playwright install --with-deps chromium
      - name: Tests responsive (Playwright)
        run: npm run test:e2e

  # ─── Contrat des scripts de sauvegarde (faux docker, aucun conteneur) ────
  sauvegarde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/sauvegarde.test.sh
